# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: mortiflix-music
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: video
priority: optional
maintainer: ${MFX_STUDIO_MAINTAINER}
vendor: Mortiflix (based on an open-source editor by Learning Machines LLC)
homepage: https://mortiflix.com
license: MIT OR Apache-2.0
description: |-
  Mortiflix Music: make a song with AI, stage by stage (idea, genre, song map,
  chords, shapes, melody, arrange, feel, export), and take it home as MIDI files
  for any DAW, with a General MIDI preview. Strudel and a General MIDI soundfont
  ship inside; FluidSynth plays the preview.
  Installs its own command names, so it never clashes with Mortiflix Studio.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
      - libasound2 | libasound2t64
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      # the song preview
      - fluidsynth
      # the sound engine (lib/mortiflix-music/bin/mortiflix-engine)
      - libfreetype6
      - libfontconfig1
      - libatomic1
  rpm:
    depends:
      # the same floor as the deb: built on glibc 2.35, so RHEL 9 (2.34) must refuse the install
      # instead of installing binaries that can't start (#93)
      - glibc >= 2.35
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
      - alsa-lib
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      # the song preview
      - fluidsynth
      # the sound engine (lib/mortiflix-music/bin/mortiflix-engine)
      - freetype
      - fontconfig
      - libatomic

contents:
  - src: ${STAGE}/usr/bin/mortiflix-music
    dst: /usr/bin/mortiflix-music
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/mortiflix-music-cli
    dst: /usr/bin/mortiflix-music-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree
  # Mortiflix Music: the service, its Node, ffmpeg and the sound engine (packaging/mortiflix)
  - src: ${STAGE}/usr/lib/mortiflix-music/
    dst: /usr/lib/mortiflix-music/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
