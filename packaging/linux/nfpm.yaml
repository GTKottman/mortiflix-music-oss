# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: mortiflix-filmcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: video
priority: optional
maintainer: ${FILMCRAFT_MAINTAINER}
vendor: Mortiflix (based on FilmCraft by Learning Machines LLC)
homepage: https://mortiflix.com
license: MIT OR Apache-2.0
description: |-
  Mortiflix FilmCraft: make a video with AI step by step (node-based), then edit
  and render it in a full video editor. Built on FilmCraft (open-source, native
  video editor: edit video, color and sound).
  Timeline editing with source and program monitors, color grading and scopes,
  effects and keyframes, titles and captions, audio mixing with loudness meters,
  and export; GPU compositing (wgpu).
  Includes mortiflix-filmcraft-cli, a headless command runner, MCP server and exporter.
  Installs its own command names, so it never clashes with upstream FilmCraft.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
      - libasound2 | libasound2t64
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      # the sound engine (lib/mortiflix-filmcraft/bin/mortiflix-engine)
      - libfreetype6
      - libfontconfig1
      - libatomic1
  rpm:
    depends:
      # the same floor as the deb: built on glibc 2.35, so RHEL 9 (2.34) must refuse the install
      # instead of installing binaries that can't start (#93)
      - glibc >= 2.35
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
      - alsa-lib
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      # the sound engine (lib/mortiflix-filmcraft/bin/mortiflix-engine)
      - freetype
      - fontconfig
      - libatomic

contents:
  - src: ${STAGE}/usr/bin/mortiflix-filmcraft
    dst: /usr/bin/mortiflix-filmcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/mortiflix-filmcraft-cli
    dst: /usr/bin/mortiflix-filmcraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree
  # Mortiflix FilmCraft: the service, its Node, ffmpeg and the sound engine (packaging/mortiflix)
  - src: ${STAGE}/usr/lib/mortiflix-filmcraft/
    dst: /usr/lib/mortiflix-filmcraft/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
