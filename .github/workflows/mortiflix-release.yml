# Mortiflix FilmCraft installers for anybody new: Linux (tarball, .deb, .rpm, AppImage, Flatpak),
# Windows (.msi + portable zip) and macOS (.dmg). Each package carries the app, filmcraft-cli and
# the Mortiflix bundle (the service with its own Node, ffmpeg and the sound engine:
# packaging/mortiflix/bundle.sh). Run by hand; the artifacts land on the run's page.
#
# Signing is optional and uses the same secrets as FilmCraft's own release (packaging/macos/package.sh,
# packaging/windows/sign.ps1). Without them the macOS build is ad-hoc signed and not notarized, and
# the Windows files are unsigned: fine for testing, not for strangers.
name: Mortiflix release

on:
  workflow_dispatch:
    inputs:
      service-repo:
        description: "The Mortiflix service repository (mortiflix-oss)"
        type: string
        default: GTKottman/mortiflix-oss
      service-ref:
        description: "Its branch, tag or commit"
        type: string
        default: mfx-service/integration
      build-engine:
        description: "Build the sound engine (mortiflix-engine: JUCE + Tracktion, ~20-40 min per OS)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mortiflix-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MFX_SERVICE_SRC: ${{ github.workspace }}/mortiflix-service
  # the checkout above is already the chosen service-ref
  MFX_SERVICE_REF: HEAD

jobs:
  linux:
    # The oldest supported glibc (2.35) so the binaries run on newer distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.service-repo }}
          ref: ${{ inputs.service-ref }}
          path: mortiflix-service
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libgtk-3-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev pkg-config \
            desktop-file-utils appstream zsync cmake ninja-build libfreetype-dev libfontconfig-dev \
            flatpak flatpak-builder xvfb xauth
      - name: nfpm
        run: |
          curl -fsSL -o nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          sudo dpkg -i nfpm.deb
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sound engine
        if: ${{ inputs.build-engine }}
        continue-on-error: true
        run: |
          cd mortiflix-service && npm ci --omit=dev --ignore-scripts
          MORTIFLIX_STUDIO="$RUNNER_TEMP/studio" node bin/mortiflix setup daw-engine --build
          echo "MFX_ENGINE_BIN=$RUNNER_TEMP/studio/tools/daw-engine/mortiflix-engine" >>"$GITHUB_ENV"
      - name: Package
        run: packaging/linux/package.sh --formats "tar deb rpm appimage"
      - name: Flatpak
        continue-on-error: true
        run: packaging/linux/flatpak-bundle.sh
      - name: Fresh install with the default tools launches to first-run setup
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 packaging/mortiflix/test_install.py
          dist/release/mortiflix-filmcraft-*-linux-x86_64.tar.gz --hide-host-tools --components default
          --expect-installed blender,blender-addons,chrome,strudel,transitions,uv
      - uses: actions/upload-artifact@v4
        with:
          name: mortiflix-filmcraft-linux
          path: dist/release/*

  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.service-repo }}
          ref: ${{ inputs.service-ref }}
          path: mortiflix-service
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Sound engine
        if: ${{ inputs.build-engine }}
        continue-on-error: true
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          Push-Location mortiflix-service
          npm ci --omit=dev --ignore-scripts
          $env:MORTIFLIX_STUDIO = Join-Path $env:RUNNER_TEMP 'studio'
          node bin/mortiflix setup daw-engine --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          "MFX_ENGINE_BIN=$env:RUNNER_TEMP/studio/tools/daw-engine/mortiflix-engine.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64
      - name: Install the MSI and check the bundle
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/release/*.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', $msi.FullName, '/qn', '/l*v', 'msi.log'
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 50; exit $p.ExitCode }
          $dir = Join-Path ${env:ProgramFiles} 'Mortiflix FilmCraft'
          & (Join-Path $dir 'filmcraft-cli.exe') --version
          $node = Join-Path $dir 'mortiflix\node\node.exe'
          $hello = '{"id":1,"type":"hello","params":{"client":"ci","protocol":1}}' | & $node (Join-Path $dir 'mortiflix\service\bin\mortiflix-service.mjs') | Select-Object -First 1
          Write-Output $hello
          if ($hello -notmatch '"ok":true') { exit 1 }
          & (Join-Path $dir 'mortiflix\bin\ffmpeg.exe') -hide_banner -version | Select-Object -First 1
          # The default tools were downloaded by the MSI (as this user): list what the studio has now.
          cmd /d /c "`"$(Join-Path $dir 'mortiflix\components.cmd')`" list"
          Select-String -Path msi.log -Pattern 'MfxToolsRun|ok blender|!! ' | Select-Object -Last 20
      - uses: actions/upload-artifact@v4
        with:
          name: mortiflix-filmcraft-windows
          path: |
            dist/release/*.msi
            dist/release/*.zip

  macos:
    runs-on: macos-14
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.service-repo }}
          ref: ${{ inputs.service-ref }}
          path: mortiflix-service
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Signing certificate (skipped without secrets)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then packaging/macos/import-cert.sh; else echo "::warning::no APPLE_CERTIFICATE: ad-hoc signed, not notarized"; fi
      - name: Sound engine (arm64)
        if: ${{ inputs.build-engine }}
        continue-on-error: true
        run: |
          brew install ninja
          cd mortiflix-service && npm ci --omit=dev --ignore-scripts
          MORTIFLIX_STUDIO="$RUNNER_TEMP/studio" node bin/mortiflix setup daw-engine --build
          echo "MFX_ENGINE_BIN=$RUNNER_TEMP/studio/tools/daw-engine/mortiflix-engine" >>"$GITHUB_ENV"
      - name: Package
        run: packaging/macos/package.sh --arch universal
      - name: Check the bundle
        run: |
          app="$(mktemp -d)"
          hdiutil attach -nobrowse -mountpoint "$app" dist/release/*.dmg
          mfx="$app/Mortiflix FilmCraft.app/Contents/Resources/mortiflix"
          lipo -info "$mfx/node/bin/node" "$mfx/bin/ffmpeg"
          printf '%s\n' '{"id":1,"type":"hello","params":{"client":"ci","protocol":1}}' \
            | "$mfx/node/bin/node" "$mfx/service/bin/mortiflix-service.mjs" | head -n1 | tee hello.json
          grep -q '"ok":true' hello.json
          hdiutil detach "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: mortiflix-filmcraft-macos
          path: dist/release/*
