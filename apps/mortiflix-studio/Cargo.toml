[package]
name = "mortiflix-studio"
description = "Mortiflix Studio desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "mortiflix-studio"
build = "build.rs"

[lints]
workspace = true

[features]
default = ["whisper", "neural-voices"]
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["mortiflix-engine/whisper", "mortiflix-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M on the CPU, downloaded on first use).
neural-voices = ["mortiflix-engine/neural-voices"]

[dependencies]
mortiflix-engine = { workspace = true }
mortiflix-export = { workspace = true }
mortiflix-project = { workspace = true }
mortiflix-render = { workspace = true }
mortiflix-time = { workspace = true }
mortiflix-gpu = { workspace = true }
mortiflix-ui-egui = { workspace = true }
mortiflix-ui = { workspace = true }
mortiflix-platform = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
cpal = "0.18"
# Files and images on the system clipboard for Paste (#611); egui already uses it for text.
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
# Help menu / About / Discord links in the system browser (MIT; as PhotoCraft).
open = "5"

[dev-dependencies]
glob = "0.3"
# graphics.rs: enumerate the real adapters in a test.
pollster = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"
# Same winit as eframe: macOS event-loop options (no app activation when driven by an agent).
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with system: the XDG desktop portal's colour scheme. The zbus the
# portal file dialogs (rfd) and accesskit already use.
zbus = "6.1"

# Icon + VERSIONINFO for mortiflix-studio.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
