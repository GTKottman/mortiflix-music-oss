[package]
name = "mortiflix-ui"
description = "Mortiflix Studio: the Mortiflix stages (stage bar, chat, nodes, preview, voice & music) as egui panels, and the Mortiflix service supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# node stills (pure Rust; the same version and formats mortiflix-media already builds)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# style frames drawn as SVG (the Look stage, the chat's looks card): pure Rust, MIT OR Apache-2.0; text with the
# system's fonts, no raster images inside SVGs, no memory-mapped fonts
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
