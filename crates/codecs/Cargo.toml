[package]
name = "mortiflix-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
mortiflix-time = { workspace = true }
mortiflix-color = { workspace = true }
mortiflix-frame = { workspace = true }
mortiflix-media = { workspace = true }
mortiflix-avi = { workspace = true }
mortiflix-isobmff = { workspace = true }
mortiflix-matroska = { workspace = true }
mortiflix-mxf = { workspace = true }
mortiflix-mpegts = { workspace = true }
mortiflix-mpeg2v = { workspace = true }
mortiflix-ac3 = { workspace = true }
mortiflix-mpa = { workspace = true }
mortiflix-ogg = { workspace = true }
mortiflix-bitstream = { workspace = true }
mortiflix-h264 = { workspace = true }
mortiflix-hevc = { workspace = true }
mortiflix-vp8 = { workspace = true }
mortiflix-vp9 = { workspace = true }
mortiflix-prores = { workspace = true }
mortiflix-dnx = { workspace = true }
mortiflix-av1 = { workspace = true }
mortiflix-apv = { workspace = true }
mortiflix-aac = { workspace = true }
mortiflix-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
mortiflix-testkit = { workspace = true }
serde_json = { workspace = true }
