[package]
name = "mortiflix-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
mortiflix-time = { workspace = true }
mortiflix-frame = { workspace = true }
mortiflix-color = { workspace = true }
mortiflix-media = { workspace = true }
mortiflix-project = { workspace = true }
mortiflix-render = { workspace = true }
mortiflix-audio-dsp = { workspace = true }
mortiflix-geom = { workspace = true }
mortiflix-text = { workspace = true }
mortiflix-isobmff = { workspace = true }
mortiflix-prores = { workspace = true }
mortiflix-dnx = { workspace = true }
mortiflix-apv = { workspace = true }
mortiflix-mxf = { workspace = true }
mortiflix-aac = { workspace = true }
mortiflix-flac = { workspace = true }
mortiflix-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
mortiflix-testkit = { workspace = true }
mortiflix-codecs = { workspace = true }
