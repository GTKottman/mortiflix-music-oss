[package]
name = "mortiflix-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
mortiflix-color = { workspace = true }
mortiflix-frame = { workspace = true }
mortiflix-geom = { workspace = true }
mortiflix-project = { workspace = true }
mortiflix-render = { workspace = true }
mortiflix-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "1.0"
rayon = { workspace = true }

[dev-dependencies]
pollster = "1.0"
mortiflix-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
mortiflix-media = { workspace = true }
mortiflix-time = { workspace = true }
