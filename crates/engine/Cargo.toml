[package]
name = "mortiflix-engine"
description = "Mortiflix Studio engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["mortiflix-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["mortiflix-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["mortiflix-tts/kokoro", "speech-download"]

[dependencies]
mortiflix-time = { workspace = true }
mortiflix-geom = { workspace = true }
mortiflix-color = { workspace = true }
mortiflix-frame = { workspace = true }
mortiflix-media = { workspace = true }
mortiflix-codecs = { workspace = true }
mortiflix-project = { workspace = true }
mortiflix-edit = { workspace = true }
mortiflix-render = { workspace = true }
mortiflix-scopes = { workspace = true }
mortiflix-text = { workspace = true }
mortiflix-audio-dsp = { workspace = true }
mortiflix-export = { workspace = true }
mortiflix-mxf = { workspace = true }
mortiflix-format = { workspace = true }
mortiflix-interchange = { workspace = true }
mortiflix-captions = { workspace = true }
mortiflix-speech = { workspace = true }
mortiflix-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = "1"

[dev-dependencies]
mortiflix-testkit = { workspace = true }
mortiflix-dng = { workspace = true, features = ["writer"] }
mortiflix-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
