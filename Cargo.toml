[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://mortiflix.com"

[workspace.dependencies]
# internal
mortiflix-time = { path = "crates/time" }
mortiflix-geom = { path = "crates/geom" }
mortiflix-color = { path = "crates/color" }
mortiflix-bitstream = { path = "crates/bitstream" }
mortiflix-isobmff = { path = "crates/isobmff" }
mortiflix-avi = { path = "crates/avi" }
mortiflix-matroska = { path = "crates/matroska" }
mortiflix-mxf = { path = "crates/mxf" }
mortiflix-cfb = { path = "crates/cfb" }
mortiflix-mpegts = { path = "crates/mpegts" }
mortiflix-mpeg2v = { path = "crates/mpeg2v" }
mortiflix-ac3 = { path = "crates/ac3" }
mortiflix-mpa = { path = "crates/mpa" }
mortiflix-ogg = { path = "crates/ogg" }
mortiflix-h264 = { path = "crates/h264" }
mortiflix-hevc = { path = "crates/hevc" }
mortiflix-vp8 = { path = "crates/vp8" }
mortiflix-vp9 = { path = "crates/vp9" }
mortiflix-prores = { path = "crates/prores" }
mortiflix-dnx = { path = "crates/dnx" }
mortiflix-apv = { path = "crates/apv" }
mortiflix-dng = { path = "crates/dng" }
mortiflix-av1 = { path = "crates/av1" }
mortiflix-aac = { path = "crates/aac" }
mortiflix-flac = { path = "crates/flac" }
mortiflix-opus = { path = "crates/opus" }
mortiflix-h264enc = { path = "crates/h264enc" }
mortiflix-audio-dsp = { path = "crates/audio-dsp" }
mortiflix-frame = { path = "crates/frame" }
mortiflix-media = { path = "crates/media" }
mortiflix-codecs = { path = "crates/codecs" }
mortiflix-project = { path = "crates/project" }
mortiflix-edit = { path = "crates/edit" }
mortiflix-interchange = { path = "crates/interchange" }
mortiflix-text = { path = "crates/text" }
mortiflix-captions = { path = "crates/captions" }
mortiflix-speech = { path = "crates/speech" }
mortiflix-tts = { path = "crates/tts" }
mortiflix-tts-text = { path = "crates/tts-text" }
mortiflix-render = { path = "crates/render" }
mortiflix-gpu = { path = "crates/gpu" }
mortiflix-scopes = { path = "crates/scopes" }
mortiflix-export = { path = "crates/export" }
mortiflix-format = { path = "crates/format" }
mortiflix-engine = { path = "crates/engine" }
mortiflix-ui-egui = { path = "crates/ui-egui" }
mortiflix-ui = { path = "crates/mortiflix-ui" }
mortiflix-automation = { path = "crates/automation" }
mortiflix-platform = { path = "crates/platform" }
mortiflix-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.mortiflix-h264]
opt-level = 3

[profile.dev.package.mortiflix-h264enc]
opt-level = 3

[profile.dev.package.mortiflix-hevc]
opt-level = 3

[profile.dev.package.mortiflix-prores]
opt-level = 3

[profile.dev.package.mortiflix-dnx]
opt-level = 3

[profile.dev.package.mortiflix-apv]
opt-level = 3

[profile.dev.package.mortiflix-dng]
opt-level = 3

[profile.dev.package.mortiflix-av1]
opt-level = 3

[profile.dev.package.mortiflix-aac]
opt-level = 3

[profile.dev.package.mortiflix-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.mortiflix-audio-dsp]
opt-level = 3

[profile.dev.package.mortiflix-mxf]
opt-level = 3

[profile.dev.package.mortiflix-opus]
opt-level = 3

[profile.dev.package.mortiflix-vp8]
opt-level = 3

[profile.dev.package.mortiflix-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
